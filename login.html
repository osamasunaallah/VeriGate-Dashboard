<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login - Inventory Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="intro-screen">
    <div class="intro-card">
      <div class="intro-badge">Inventory Control</div>
      <h1>Welcome Admin</h1>
      <p>Smart RFID truck entry, PO tracking, shipment verification, and live analytics.</p>

      <form id="loginForm" class="login-form">
        <input id="username" type="text" placeholder="Admin username" required />
        <input id="password" type="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>

      <p id="loginError" class="login-error"></p>

      <div class="footer-note">
        Created by <strong>Osama</strong>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "123456";

    if (localStorage.getItem("truck_admin_logged_in") === "true") {
      window.location.href = "index.html";
    }

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const error = document.getElementById("loginError");

      if (username === ADMIN_USER && password === ADMIN_PASS) {
        localStorage.setItem("truck_admin_logged_in", "true");
        localStorage.setItem("truck_admin_user", username);
        window.location.href = "index.html";
      } else {
        error.textContent = "Invalid admin username or password.";
      }
    });
  </script>
</body>
</html>
